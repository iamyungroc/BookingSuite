<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RocAudio Suite</title>
<meta name="description" content="RocAudio Suite client app — bookings, payments, invoices and live studio chat.">
<meta name="theme-color" content="#120b07">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RocAudio">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<!-- top bar -->
<header class="topbar">
  <a href="#/home" class="brandline" style="color:var(--text)">
    <img src="assets/icon-192.png" class="logo-mark" alt="RocAudio logo">
    <span>RocAudio Suite<small id="top-tag">Tech Company • Europe</small></span>
  </a>
  <div class="right">
    <button class="icon-btn" id="btn-install" title="Install app" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16"/></svg>
    </button>
    <button class="icon-btn" id="btn-bell" title="Notifications">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot hide" id="bell-dot">0</span>
    </button>
  </div>
</header>

<!-- routed view -->
<main id="view"></main>

<!-- bottom tabs -->
<nav class="tabbar" id="tabbar">
  <button data-t="home"><span class="tdot"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>Home</button>
  <button data-t="services"><span class="tdot"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Services</button>
  <button data-t="bookings"><span class="tdot"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Bookings</button>
  <button data-t="chat"><span class="tdot"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Chat</button>
  <button data-t="profile"><span class="tdot"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Profile</button>
</nav>

<div id="toasts"></div>
<div id="modal-root"></div>
<div id="notif-root"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
