/* ---------- service detail ---------- */

.bonus-row .cb { width: 18px; height: 18px; flex: none; border-radius: 6px; border: 2px solid var(--line-2); display: grid; place-items: center; transition: all .16s; }

/* ---------- calendar ---------- */
.cal { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)), var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--hi); }

.cal .nav-b:hover { border-color: rgba(255, 171, 82, .5); color: var(--ice); }
.cal .nav-b svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.cal .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .dow { text-align: center; font-size: 10px; font-weight: 850; color: var(--muted-2); letter-spacing: .08em; padding: 5px 0; }
.cal .day {
  position: relative; aspect-ratio: 1; display: grid; place-items: center;

}

.cal .day .ev { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 7px var(--teal); }

.slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.slots button:hover { color: var(--text); border-color: var(--line-2); }

/* ---------- booking rows ---------- */
.bkg { padding: 15px 16px; display: flex; gap: 13px; align-items: center; cursor: pointer; }
.bkg .datebox {

}

/* ---------- chat ---------- */
.chat-wrap { display: flex; flex-direction: column; height: calc(100dvh - 88px - env(safe-area-inset-top)); padding-bottom: calc(92px + env(safe-area-inset-bottom)); box-sizing: border-box; }

}
.chat-head .av { width: 41px; height: 41px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-weight: 850; color: #2a1608; box-shadow: var(--glow-teal); }
.chat-head .st { font-size: 12px; color: var(--ok); display: flex; align-items: center; gap: 6px; }

@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.chat-body {
  flex: 1; overflow-y: auto; padding: 18px 12px; display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(180deg, rgba(14,8,4,.5), rgba(14,8,4,.25)), rgba(18, 10, 5, .6);
  border-left: 1px solid var(--line); border-right: 1px solid var(--line);
}
.msg { max-width: 82%; padding: 10px 14px; border-radius: 17px; font-size: 14px; line-height: 1.45; box-shadow: var(--hi); animation: rise .3s ease both; white-space: pre-line; }
.msg .tm { display: block; font-size: 10.5px; opacity: .55; margin-top: 4px; }
.msg.in { align-self: flex-start; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-bottom-left-radius: 6px; backdrop-filter: blur(8px); }
.msg.out { align-self: flex-end; background: linear-gradient(135deg, #8a4d1f, #6e3413); border-bottom-right-radius: 6px; box-shadow: 0 6px 18px rgba(138, 77, 31, .3); }
.typing { align-self: flex-start; display: flex; gap: 4px; padding: 13px 15px; background: rgba(255,255,255,.06); border-radius: 17px; border: 1px solid var(--line); }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.chips-row { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: rgba(18, 10, 5, .5); border-left: 1px solid var(--line); border-right: 1px solid var(--line); scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.qchip { cursor: pointer; white-space: nowrap; font-size: 11px; }
.chat-input {
  display: flex; gap: 9px; padding: 11px;
  background: rgba(26, 15, 8, .8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line); border-radius: 0 0 18px 18px; box-shadow: var(--hi);
}
.chat-input input { flex: 1; background: rgba(14, 8, 4, .6); border: 1px solid var(--line-2); border-radius: 13px; padding: 11px 15px; outline: none; transition: border-color .15s, box-shadow .15s; }

.chat-input button { width: 45px; height: 45px; flex: none; border-radius: 14px; border: none; background: var(--grad); display: grid; place-items: center; box-shadow: var(--glow-teal); transition: transform .15s; }
.chat-input button:active { transform: scale(.92); }
.chat-input button svg { width: 19px; height: 19px; stroke: #2a1608; fill: none; stroke-width: 2.2; }

/* ---------- sender labels / review replies / tab badges ---------- */
.msg .sender { display: block; font-size: 9px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-bottom: 3px; }
.rev-reply {
  margin: 4px 0 10px; padding: 10px 12px; font-size: 12.5px; color: var(--text);
  background: var(--grad-soft); border: 1px solid rgba(224, 118, 42, .3); border-radius: 12px; box-shadow: var(--hi);
}
.rev-reply b { color: var(--teal); }
.bcount {
  display: inline-block; min-width: 15px; height: 15px; padding: 0 4px; margin-left: 4px;
  background: var(--danger); color: #fff; border-radius: 8px; font-size: 9px; font-weight: 850;
  line-height: 15px; vertical-align: middle; box-shadow: 0 0 8px rgba(255, 112, 112, .5);
}

/* ---------- checkout ---------- */
.pay-meth { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 15px; cursor: pointer; margin-bottom: 9px; background: rgba(14, 8, 4, .45); box-shadow: var(--hi); transition: all .16s; }
.pay-meth:hover { border-color: var(--line-2); }
.pay-meth.on { border-color: rgba(255, 171, 82, .65); background: rgba(255, 171, 82, .07); box-shadow: var(--hi), var(--glow-ice); }
.pay-meth .rad { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; position: relative; }

.pay-meth b { font-size: 14px; display: block; }
.pay-meth span { font-size: 12px; color: var(--muted-2); }
.sum-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; color: var(--muted); }
.sum-row.total { color: var(--text); font-weight: 800; font-size: 16.5px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
.success-anim { text-align: center; padding: 26px 0 10px; }
.success-anim .ring {
  position: relative; width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%;
  background: rgba(64, 224, 156, .1); border: 2px solid var(--ok);
  display: grid; place-items: center; animation: popIn .4s cubic-bezier(.2, 1.4, .4, 1);
  box-shadow: 0 0 40px rgba(64, 224, 156, .35), inset 0 0 24px rgba(64, 224, 156, .12);

/* ---------- invoice (paper document) ---------- */
.invoice {
  background: #fbfcfe; color: #16202c; border-radius: 18px; padding: 34px; font-size: 13.5px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  position: relative; overflow: hidden;
}
.invoice::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--grad); }

.invoice table { width: 100%; border-collapse: collapse; margin: 20px 0; }
.invoice th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #6b7a8d; padding: 8px 6px; border-bottom: 2px solid #dde5ec; }

.invoice .totals { margin-left: auto; width: 250px; }
.invoice .totals div { display: flex; justify-content: space-between; padding: 4px 0; }

.invoice .sentlog { margin-top: 20px; font-size: 12px; color: #5d6c7d; background: #eef3f7; border-radius: 10px; padding: 11px 13px; border: 1px solid #dde5ec; }
@media print {
  body * { visibility: hidden; }
  .invoice, .invoice * { visibility: visible; }
  .invoice { position: absolute; inset: 0; border-radius: 0; box-shadow: none; }
  .no-print { display: none !important; }
}

/* ---------- notifications panel ---------- */
.notif-panel {
  position: fixed; top: 62px; right: 12px; z-index: 500; width: min(360px, calc(100vw - 24px));
  background: rgba(30, 18, 10, .9); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--line-2); border-radius: 20px;

}

/* ---------- auth ---------- */

.auth-tabs { display: flex; background: rgba(14, 8, 4, .55); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 20px; }
.auth-tabs button { flex: 1; background: none; border: none; color: var(--muted); font-weight: 750; font-size: 14px; padding: 10px; border-radius: 11px; transition: all .18s; }

.prof-head { display: flex; align-items: center; gap: 15px; }
.prof-head .av { width: 58px; height: 58px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-size: 21px; font-weight: 850; color: #2a1608; box-shadow: var(--glow-teal); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 4px; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: none; }
.setting-row b { font-size: 14.5px; display: block; }
.setting-row span { font-size: 12.5px; color: var(--muted-2); }
.switch { position: relative; width: 47px; height: 28px; flex: none; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-2); transition: background .2s; cursor: pointer; box-shadow: var(--hi); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: left .2s cubic-bezier(.2,1.2,.4,1), background .2s; }

const RBS = (() => {
  "use strict";

  const mem = {}; // fallback when localStorage unavailable
  const store = {
    get(k) {
      try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; }
    },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; }
    },
    del(k) {
      try { localStorage.removeItem(k); } catch (e) { delete mem[k]; }
    },
  };

  const K = {
    users: "rbs_users", session: "rbs_session", bookings: "rbs_bookings",
    payments: "rbs_payments", invoices: "rbs_invoices", chat: "rbs_chat",

    assistant: "rbs_assistant_on", studiopin: "rbs_studio_pin", pinlock: "rbs_pin_lock",
  };

  const get = (k, fb) => { try { const v = JSON.parse(store.get(k)); return v == null ? fb : v; } catch (e) { return fb; } };
  const set = (k, v) => store.set(k, JSON.stringify(v));

  const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => new Date().toISOString();

  /* demo-only hash (NOT for production) */
  const hash = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "h" + (h >>> 0); };

  const money = (n) => {
    const sym = CONFIG.brand.currencySymbol;
    return sym + Number(n).toFixed(2).replace(/\.00$/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  };
  const moneyFull = (n) => {
    const [i, d] = Number(n).toFixed(2).split(".");
    return CONFIG.brand.currencySymbol + i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + d;
  };

  const dateStr = (d) => {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  };
  const prettyDate = (s) => {
    const d = new Date(s + (s.length === 10 ? "T12:00:00" : ""));
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  };

  /* ---------------- AUTH ---------------- */
  const users = () => get(K.users, []);
  const saveUsers = (u) => set(K.users, u);

  function register({ name, email, phone, password }) {
    const list = users();
    email = String(email).trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { error: "Enter a valid email address." };
    if (!name || name.trim().length < 2) return { error: "Enter your full name." };
    if (!password || password.length < 6) return { error: "Password must be at least 6 characters." };
    if (list.some((u) => u.email === email)) return { error: "An account with this email already exists. Log in instead." };
    if (email === String((CONFIG.studio || {}).email || "").toLowerCase()) return { error: "This email is reserved for admin." };
    const user = { id: uid("usr"), name: name.trim(), email, phone: phone || "", password: hash(password), createdAt: now() };
    list.push(user); saveUsers(list);
    sessStore().setItem(K.session, user.id);
    notify(user.id, "Welcome to " + CONFIG.brand.appName, "Your account is ready. Book your first session and track everything here.");
    return { user };
  }

  function login(email, password) {
    const u = users().find((x) => x.email === String(email).trim().toLowerCase());
    if (!u || u.password !== hash(password)) return { error: "Incorrect email or password." };
    sessStore().setItem(K.session, u.id);
    return { user: u };
  }

  const memSess = {
    getItem(k) { return mem[k] ?? null; },
    setItem(k, v) { mem[k] = String(v); },
    removeItem(k) { delete mem[k]; },
  };
  const sessStore = () => {
    try { return localStorage.getItem("rbs_remember") === "0" ? sessionStorage : localStorage; }
    catch (e) { return memSess; }
  };
  const setRemember = (on) => { try { localStorage.setItem("rbs_remember", on ? "1" : "0"); } catch (e) {} };
  const getRemember = () => { try { return localStorage.getItem("rbs_remember") !== "0"; } catch (e) { return true; } };
  const logout = () => {
    try { localStorage.removeItem(K.session); } catch (e) {}
    try { sessionStorage.removeItem(K.session); } catch (e) {}
    delete mem[K.session];
  };
  const isStudio = () => {
    try { return sessionStorage.getItem(K.session) === "studio" || localStorage.getItem(K.session) === "studio"; }
    catch (e) { return mem[K.session] === "studio"; }
  };
  const LOCK_MS = 5 * 60 * 1000, MAX_TRIES = 5;
  function loginAdmin(pin) {
    const L = get(K.pinlock, { n: 0, t: 0 });
    if (L.n >= MAX_TRIES && Date.now() - L.t < LOCK_MS)
      return { error: "Too many attempts. Console locked for 5 minutes." };
    const stored = store.get(K.studiopin);
    const correct = stored ? stored === hash(pin) : hash(pin) === (CONFIG.studio || {}).pinHash;
    if (!correct) {
      L.n = (Date.now() - L.t < LOCK_MS ? L.n : 0) + 1; L.t = Date.now();
      set(K.pinlock, L);
      return { error: "Wrong PIN. " + Math.max(0, MAX_TRIES - L.n) + " attempt(s) left." };
    }
    set(K.pinlock, { n: 0, t: 0 });
    sessStore().setItem(K.session, "studio");
    return { ok: true };
  }
  function changeStudioPin(current, next) {
    const stored = store.get(K.studiopin);
    const okCur = stored ? stored === hash(current) : hash(current) === (CONFIG.studio || {}).pinHash;
    if (!okCur) return { error: "Current PIN incorrect." };
    if (!/^\d{4,8}$/.test(next)) return { error: "New PIN must be 4-8 digits." };
    store.set(K.studiopin, hash(next));
    return { ok: true };
  }
  const currentUser = () => {
    let id = null;
    try { id = sessionStorage.getItem(K.session) || localStorage.getItem(K.session); } catch (e) { id = store.get(K.session); }
    return id ? users().find((u) => u.id === id) || null : null;
  };
  function updateUser(id, patch) {
    const list = users(); const u = list.find((x) => x.id === id);
    if (!u) return { error: "User not found." };
    Object.assign(u, patch);
    if (patch.password) u.password = hash(patch.password);
    saveUsers(list); return { user: u };
  }

  /* ---------------- BOOKINGS ---------------- */
  const bookings = () => get(K.bookings, []);
  function createBooking(b) {
    const list = bookings();
    const booking = Object.assign({ id: uid("bkg"), createdAt: now(), status: "awaiting_payment" }, b);
    list.push(booking); set(K.bookings, list);
    return booking;
  }
  function updateBooking(id, patch) {
    const list = bookings(); const b = list.find((x) => x.id === id);
    if (!b) return null; Object.assign(b, patch); set(K.bookings, list); return b;
  }
  const userBookings = (uid_) => bookings().filter((b) => b.userId === uid_).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

  /* ---------------- PAYMENTS ---------------- */
  const payments = () => get(K.payments, []);
  function createPayment(p) {
    const list = payments();
    const pay = Object.assign({ id: uid("pay"), ref: ("RBS-" + Math.random().toString(36).slice(2, 8).toUpperCase()), createdAt: now() }, p);
    list.push(pay); set(K.payments, list);
    return pay;
  }
  const userPayments = (uid_) => payments().filter((p) => p.userId === uid_).sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  /* ---------------- INVOICES ---------------- */
  const invoices = () => get(K.invoices, []);
  function createInvoice(inv) {
    const list = invoices();
    const num = "RBS-" + new Date().getFullYear() + "-" + String(list.length + 1).padStart(4, "0");
    const invoice = Object.assign({ id: uid("inv"), number: num, createdAt: now(), sentTo: [], sentAt: null }, inv);
    list.push(invoice); set(K.invoices, list);
    return invoice;
  }
  const getInvoice = (id) => invoices().find((i) => i.id === id) || null;
  const userInvoices = (uid_) => invoices().filter((i) => i.userId === uid_).sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  /* simulate auto-send: client email + business copy */
  function sendInvoice(id) {
    const list = invoices(); const inv = list.find((i) => i.id === id);
    if (!inv) return null;
    const user = users().find((u) => u.id === inv.userId);
    inv.sentTo = [user ? user.email : "client", CONFIG.brand.businessEmail];
    inv.sentAt = now();
    set(K.invoices, list);
    return inv;
  }

  /* ---------------- CHAT ---------------- */
  const chatAll = () => get(K.chat, {});
  const thread = (uid_) => (chatAll()[uid_] || []);
  function sendMessage(uid_, from, text) {
    const all = chatAll();
    if (!all[uid_]) all[uid_] = [];
    const msg = { id: uid("msg"), from, text, ts: now() };
    all[uid_].push(msg); set(K.chat, all);
    return msg;
  }

  const svcFrom = (id) => CONFIG.services.find((s) => s.id === id);
  function proReply(text) {
    const t = String(text).toLowerCase();
    const B_ = CONFIG.brand;
    const list = (cat) => CONFIG.services.filter((s) => !cat || s.category === cat)
      .map((s) => "• " + s.name + " — from " + money(Math.min(...s.packages.map((p) => p.price))) + " (" + s.delivery + ")").join("\n");
    if (/(^|\s)(hi|hello|hey|good (day|morning|afternoon|evening))\b/.test(t))
      return "Good day, and welcome to the RocAudio Studio Desk.\nI can assist with: prices & packages, delivery times, bookings, payment options, invoices and training.\nType \"human\" at any time and Roc joins you personally. How may I help you today?";
    if (/price|cost|how much|rate|charge|fee/.test(t))
      return "Our current rate card:\n" + list() + "\nPayment plans: pay in full, 50% deposit, or 3 installments where offered. Shall I book you in?";
    if (/deliver|turnaround|how long|when will|eta/.test(t))
      return "Delivery commitments:\n" + CONFIG.services.map((s) => "• " + s.name + ": " + s.delivery).join("\n") + "\nRush options are available as bonuses at checkout.";
    if (/book|schedule|slot|calendar|reserve|appoint/.test(t))
      return "Booking takes under a minute:\n1. Services → choose your package & bonuses\n2. Pick a date & time on the calendar (" + CONFIG.booking.note + ", " + CONFIG.booking.timezone + ")\n3. Confirm & pay — invoice arrives by email instantly.\nWould you like me to recommend a package?";
    if (/pay|invoice|receipt|refund|deposit|installment|bank|card/.test(t))
      return "We accept: " + CONFIG.paymentMethods.map((m) => m.name).join(", ") + ".\nPlans: pay in full, 50% deposit (balance on delivery), or 3 monthly installments where offered.\nEvery payment is confirmed in-app and invoiced automatically to your email and our books.\nRefunds: " + CONFIG.refundPolicy;
    if (/train|class|course|learn|academy|bootcamp|mentor/.test(t))
      return "The Symphony Producers Academy runs:\n" + list("training") + "\nCertificates on completion. Which skill are we building first?";
    if (/beat|produce|production|instrumental/.test(t))
      return "The Beats by Roc Company Limited delivers:\n" + list("production") + "\nSend a reference track in chat and we'll match the vision.";
    if (/mix|master|stem/.test(t))
      return "RocAudio™ Studio Services:\n" + list("studio") + "\nStem-based, revision rounds included, club & streaming loudness targets honoured.";
    if (/human|roc\b|agent|manager|owner|staff|person/.test(t))
      return "Noted with care — I've escalated this to Roc personally.\nStudio desk hours: " + (CONFIG.booking.hours[0] || "09:00") + "–" + (CONFIG.booking.hours[CONFIG.booking.hours.length - 1] || "18:00") + " " + CONFIG.booking.timezone + ", Monday to Saturday. Expect a direct reply in this chat shortly.";
    if (/thank|thanks|appreciate|cheers/.test(t))
      return "Our pleasure — that's what the Studio Desk is for.\nAnything else I can arrange for you today?";
    if (/contact|email|phone|call|reach/.test(t))
      return "You can reach the business at " + B_.businessEmail + " or " + B_.phone + " — or right here in chat, which is monitored throughout studio hours.";
    return "Thank you for reaching out to the RocAudio Studio Desk.\nI can assist with: prices, delivery times, bookings, payment options, invoices, training and production enquiries — or type \"human\" for Roc directly.\nHow may I help you?";
  }
  const autoReply = (text) => proReply(text);

  /* ---------------- REVIEWS ---------------- */
  const reviews = () => get(K.reviews, []);
  function addReview(r) {
    const list = reviews();
    if (r.userId) {
      const mine = list.find((x) => x.userId === r.userId && x.serviceId === r.serviceId);
      if (mine) { mine.rating = r.rating; mine.text = r.text; mine.ts = now(); set(K.reviews, list); return mine; }
    }
    const rev = Object.assign({ id: uid("rev"), ts: now() }, r);
    list.push(rev); set(K.reviews, list);
    return rev;
  }
  function addReviewReply(reviewId, text) {
    const list = reviews(); const rev = list.find((x) => x.id === reviewId);
    if (!rev) return null;
    rev.reply = { text, ts: now() };
    set(K.reviews, list);
    if (rev.userId) notify(rev.userId, "The studio replied to your review", text.slice(0, 80), "#/service/" + rev.serviceId);
    return rev;
  }
  const canReview = (userId, serviceId) => bookings().some((b) => b.userId === userId && b.serviceId === serviceId && b.status === "delivered");
  const userReview = (userId, serviceId) => reviews().find((r) => r.userId === userId && r.serviceId === serviceId) || null;
  function serviceReviews(serviceId) {
    return reviews().filter((r) => r.serviceId === serviceId).sort((a, b) => b.ts.localeCompare(a.ts));
  }
  function serviceRating(serviceId) {
    const rs = serviceReviews(serviceId);
    if (!rs.length) return { avg: 0, count: 0 };
    return { avg: rs.reduce((s, r) => s + r.rating, 0) / rs.length, count: rs.length };
  }

  /* ---------------- NOTIFICATIONS ---------------- */
  const notifs = () => get(K.notifs, []);

    const n = { id: uid("ntf"), userId: uid_, title, body, ts: now(), read: false, route: route || "#/bookings" };
    list.push(n);
    set(K.notifs, list);
    /* browser notification if allowed — tappable: opens the app at the right screen */
    try {
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {

  }
  const userNotifs = (uid_) => notifs().filter((n) => n.userId === uid_).sort((a, b) => b.ts.localeCompare(a.ts));
  const unreadCount = (uid_) => userNotifs(uid_).filter((n) => !n.read).length;
  function markAllRead(uid_) {
    const list = notifs();
    list.forEach((n) => { if (n.userId === uid_) n.read = true; });
    set(K.notifs, list);
  }

  /* ---------------- CLOUD SYNC MERGE ---------------- */
  function mergeRemote(name, rows) {
    if (!rows || !rows.length) return 0;
    let changed = 0;
    if (name === "chat") {
      const all = chatAll();
      rows.forEach((m) => {
        const arr = all[m.client_id] || [];
        if (!arr.some((x) => x.id === m.id)) { arr.push({ id: m.id, from: m.sender, text: m.body, ts: m.created_at }); changed++; }
        all[m.client_id] = arr;
      });
      if (changed) set(K.chat, all);
      return changed;
    }
    const KMAP = { users: K.users, bookings: K.bookings, payments: K.payments, invoices: K.invoices, reviews: K.reviews, notifs: K.notifs };
    const list = get(KMAP[name], []);
    const idx = {}; list.forEach((x, i) => idx[x.id] = i);
    rows.forEach((r) => {
      if (idx[r.id] == null) { list.push(r); changed++; }
      else if (JSON.stringify(list[idx[r.id]]) !== JSON.stringify(r)) { list[idx[r.id]] = r; changed++; }
    });
    if (changed) set(KMAP[name], list);
    return changed;
  }

  /* ---------------- STUDIO OPS ---------------- */
  const STATUS_LABEL = { awaiting_payment: "awaiting payment", confirmed: "confirmed", in_progress: "in progress", delivered: "delivered", cancelled: "cancelled" };
  function setBookingStatus(id, status) {
    const b = updateBooking(id, { status });
    if (!b) return null;
    notify(b.userId, "Booking " + STATUS_LABEL[status], b.serviceName + " (" + prettyDate(b.date) + " " + b.time + ") is now " + STATUS_LABEL[status] + ".", "#/bookings");
    sendMessage(b.userId, "studio", "Status update — " + b.serviceName + ": " + STATUS_LABEL[status] + ".");
    return b;
  }
  function markPaymentPaid(pid) {
    const list = payments(); const p = list.find((x) => x.id === pid);
    if (!p || p.status === "paid") return p;
    p.status = "paid"; p.paidAt = now(); set(K.payments, list);
    const il = invoices(); const inv = il.find((i) => i.bookingId === p.bookingId);
    if (inv) {
      inv.paid = Math.round((inv.paid + p.amount) * 100) / 100;
      if (inv.paid >= inv.total) inv.status = "paid";
      set(K.invoices, il);
    }
    notify(p.userId, "Payment confirmed ✓", moneyFull(p.amount) + " received. Thank you!", "#/payments");
    return p;
  }
  const getAssistant = () => { const v = store.get(K.assistant); return v == null ? ((CONFIG.studio || {}).assistantDefault !== false) : v === "1"; };
  const setAssistant = (on) => store.set(K.assistant, on ? "1" : "0");

  /* ---------------- SEED (first run) ---------------- */
  function seed() {
    if (store.get(K.seeded)) return;
    set(K.seeded, "1");
    (CONFIG.seedReviews || []).forEach((r) => addReview({ serviceId: r.serviceId, name: r.name, rating: r.rating, text: r.text, seeded: true }));

    /* demo account with history so the app is explorable instantly */
    const demo = { id: "usr_demo", name: "Demo Client", email: "demo@rocaudio.eu", phone: "+31 6 1234 5678", password: hash("demo1234"), createdAt: now() };
    saveUsers([demo]);

    const svc = CONFIG.services.find((s) => s.id === "mix-master");
    const pkg = svc.packages[0];
    const d1 = dateStr(Date.now() - 6 * 864e5), d2 = dateStr(Date.now() + 3 * 864e5);

    const netOf = (g) => Math.round(g / (1 + CONFIG.brand.vatRate / 100) * 100) / 100;
    const b1 = createBooking({ userId: demo.id, serviceId: svc.id, serviceName: svc.name, packageName: pkg.name, date: d1, time: "14:00", notes: "Single release — reference: warm analog.", status: "delivered", total: pkg.price, payOption: "full" });
    const p1 = createPayment({ userId: demo.id, bookingId: b1.id, amount: pkg.price, method: "card", status: "paid", paidAt: now() });
    sendInvoice(createInvoice({ userId: demo.id, bookingId: b1.id, lines: [{ label: svc.name + " — " + pkg.name, amount: pkg.price }], subtotal: netOf(pkg.price), vat: +(pkg.price - netOf(pkg.price)).toFixed(2), total: pkg.price, paid: p1.amount, status: "paid" }).id);

    const svc2 = CONFIG.services.find((s) => s.id === "beat-making");
    const pkg2 = svc2.packages[0];
    const b2 = createBooking({ userId: demo.id, serviceId: svc2.id, serviceName: svc2.name, packageName: pkg2.name, date: d2, time: "10:00", notes: "Afrobeats single, club + streaming masters.", status: "confirmed", total: pkg2.price, payOption: "full" });
    createPayment({ userId: demo.id, bookingId: b2.id, amount: pkg2.price, method: "paypal", status: "paid", paidAt: now() });
    sendInvoice(createInvoice({ userId: demo.id, bookingId: b2.id, lines: [{ label: svc2.name + " — " + pkg2.name, amount: pkg2.price }], subtotal: netOf(pkg2.price), vat: +(pkg2.price - netOf(pkg2.price)).toFixed(2), total: pkg2.price, paid: pkg2.price, status: "paid" }).id);

    sendMessage(demo.id, "studio", "Welcome to the RocAudio studio chat! Drop your references, stems questions or booking requests here — we usually reply within minutes.");
    notify(demo.id, "Booking confirmed", svc2.name + " on " + prettyDate(d2) + " at 10:00. Invoice sent to your email.");
  }

  return {
    get, set, uid, now, hash, money, moneyFull, dateStr, prettyDate,
    register, login, logout, currentUser, updateUser, users,
    bookings, createBooking, updateBooking, userBookings,
    payments, createPayment, userPayments,
    invoices, createInvoice, getInvoice, userInvoices, sendInvoice,
    chatAll, thread, sendMessage, autoReply,
    reviews, addReview, serviceReviews, serviceRating,
    notifs, notify, userNotifs, unreadCount, markAllRead,
    mergeRemote, setRemember, getRemember,
    seed, isStudio, loginAdmin, setBookingStatus, markPaymentPaid,
    getAssistant, setAssistant, canReview, userReview, addReviewReply, STATUS_LABEL,
    changeStudioPin,
  };
})();

if (typeof module !== "undefined" && module.exports) module.exports = RBS;

<script>
/* ============================================================
   RocAudio Suite — CLOUD SYNC (free Supabase REST, no SDK)
   ------------------------------------------------------------
   Makes the app a true multi-device product: chats, bookings,
   payments, invoices, reviews and notifications sync between
   ANY phones/computers in the world.

   SETUP (5 min, $0):
   1. supabase.com → New project (free tier)
   2. SQL editor → paste backend/supabase-schema.sql → Run
   3. Project Settings → API → copy Project URL + anon key
   4. Paste both into js/config.js → backend { url, key }
   5. Redeploy. Done — sync polls every 6s both directions.

   Without keys configured the app stays fully functional in
   offline-first local mode (current behaviour).
   ============================================================ */
const Sync = (() => {
  "use strict";
  const cfg = () => CONFIG.backend || {};
  const on = () => !!(cfg().url && cfg().key);
  const H = () => ({
    apikey: cfg().key,
    Authorization: "Bearer " + cfg().key,
    "Content-Type": "application/json",
    Prefer: "return=minimal,resolution=merge-duplicates",
  });
  const stamp = () => new Date().toISOString();
  let last = "1970-01-01T00:00:00.000Z";
  let timer = null;
  let busy = false;

  /* local row -> table row */
  const ROW = {
    users: (u) => ({ id: u.id, full_name: u.name, email: u.email, phone: u.phone || "", role: "client", created_at: u.createdAt || stamp(), updated_at: stamp() }),
    bookings: (b) => ({ id: b.id, client_id: b.userId, service_id: b.serviceId, service_name: b.serviceName, package_name: b.packageName, bonuses: b.bonuses || [], booking_date: b.date, booking_time: b.time, notes: b.notes || "", pay_option: b.payOption || "full", total: b.total, status: b.status, created_at: b.createdAt || stamp(), updated_at: stamp() }),
    payments: (p) => ({ id: p.id, client_id: p.userId, booking_id: p.bookingId, ref: p.ref, amount: p.amount, method: p.method, status: p.status, paid_at: p.paidAt, created_at: p.createdAt || stamp(), updated_at: stamp() }),
    invoices: (i) => ({ id: i.id, client_id: i.userId, booking_id: i.bookingId, number: i.number, lines: i.lines, subtotal: i.subtotal, vat: i.vat, total: i.total, paid: i.paid, status: i.status, sent_to: i.sentTo || [], sent_at: i.sentAt, created_at: i.createdAt || stamp(), updated_at: stamp() }),
    reviews: (r) => ({ id: r.id, client_id: r.userId || null, service_id: r.serviceId, author_name: r.name, rating: r.rating, body: r.text, reply_text: r.reply ? r.reply.text : null, reply_at: r.reply ? r.reply.ts : null, created_at: r.ts || stamp(), updated_at: stamp() }),
    notifs: (n) => ({ id: n.id, client_id: n.userId, title: n.title, body: n.body, read: n.read, route: n.route || "#/bookings", created_at: n.ts || stamp(), updated_at: stamp() }),
  };
  /* table row -> local row */
  const LOC = {
    users: (r) => ({ id: r.id, name: r.full_name, email: r.email, phone: r.phone || "", password: "h0", createdAt: r.created_at }),
    bookings: (r) => ({ id: r.id, userId: r.client_id, serviceId: r.service_id, serviceName: r.service_name, packageName: r.package_name, bonuses: r.bonuses || [], date: r.booking_date, time: r.booking_time, notes: r.notes || "", payOption: r.pay_option, total: r.total, status: r.status, createdAt: r.created_at }),
    payments: (r) => ({ id: r.id, userId: r.client_id, bookingId: r.booking_id, ref: r.ref, amount: r.amount, method: r.method, status: r.status, paidAt: r.paid_at, createdAt: r.created_at }),
    invoices: (r) => ({ id: r.id, userId: r.client_id, bookingId: r.booking_id, number: r.number, lines: r.lines, subtotal: r.subtotal, vat: r.vat, total: r.total, paid: r.paid, status: r.status, sentTo: r.sent_to || [], sentAt: r.sent_at, createdAt: r.created_at }),
    reviews: (r) => ({ id: r.id, userId: r.client_id, serviceId: r.service_id, name: r.author_name, rating: r.rating, text: r.body, reply: r.reply_text ? { text: r.reply_text, ts: r.reply_at } : undefined, ts: r.created_at }),
    notifs: (r) => ({ id: r.id, userId: r.client_id, title: r.title, body: r.body, read: r.read, route: r.route, ts: r.created_at }),
  };
  const TABLE = { users: "profiles", bookings: "bookings", payments: "payments", invoices: "invoices", reviews: "reviews", notifs: "notifications" };
  const LOCAL = { users: () => RBS.users(), bookings: () => RBS.bookings(), payments: () => RBS.payments(), invoices: () => RBS.invoices(), reviews: () => RBS.reviews(), notifs: () => RBS.notifs() };

  const sent = {}; // id -> json fingerprint, to avoid re-pushing

  async function upsert(table, rows) {
    if (!rows.length) return;
    for (let i = 0; i < rows.length; i += 50) {
      await fetch(cfg().url + "/rest/v1/" + table, { method: "POST", headers: H(), body: JSON.stringify(rows.slice(i, i + 50)) });
    }
  }

  async function pushAll() {
    if (!on()) return;
    for (const name of Object.keys(TABLE)) {
      const rows = LOCAL[name]().map((x) => { const r = ROW[name](x); r._fp = JSON.stringify(r); return r; });
      const fresh = rows.filter((r) => sent[r.id] !== r._fp);
      if (fresh.length) {
        await upsert(TABLE[name], fresh.map((r) => { const c = Object.assign({}, r); delete c._fp; return c; }));
        fresh.forEach((r) => { sent[r.id] = r._fp; });
      }
    }
    /* chat messages */
    const msgs = [];
    Object.entries(RBS.chatAll()).forEach(([cid, arr]) => arr.forEach((m) => msgs.push({ id: m.id, client_id: cid, sender: m.from, body: m.text, created_at: m.ts || stamp(), updated_at: stamp() })));
    const freshM = msgs.filter((m) => sent["m" + m.id] !== m.body + m.sender);
    if (freshM.length) {
      await upsert("messages", freshM);
      freshM.forEach((m) => { sent["m" + m.id] = m.body + m.sender; });
    }
  }

  async function pull() {
    if (!on()) return 0;
    let changed = 0;
    const since = encodeURIComponent(last);
    for (const name of Object.keys(TABLE)) {
      const res = await fetch(cfg().url + "/rest/v1/" + TABLE[name] + "?select=*&updated_at=gt." + since, { headers: { apikey: cfg().key, Authorization: "Bearer " + cfg().key } });
      if (!res.ok) continue;
      const rows = await res.json();
      changed += RBS.mergeRemote(name, rows.map(LOC[name]));
    }
    const resM = await fetch(cfg().url + "/rest/v1/messages?select=*&updated_at=gt." + since, { headers: { apikey: cfg().key, Authorization: "Bearer " + cfg().key } });
    if (resM.ok) changed += RBS.mergeRemote("chat", await resM.json());
    last = stamp();
    return changed;
  }

  async function cycle() {
    if (busy || !on()) return;
    busy = true;
    try {
      await pushAll();
      const changed = await pull();
      if (changed > 0) {
        try { window.dispatchEvent(new Event("rbs-sync")); } catch (e) {}
      }
    } catch (e) { /* network dips are fine — next cycle retries */ }
    busy = false;
  }

  function start() {
    if (!on() || timer) return;
    cycle();
    timer = setInterval(cycle, 6000);
  }

  return { on, start, cycle, pushAll, pull };
})();

if (typeof module !== "undefined" && module.exports) module.exports = Sync;

</script>

      '<div class="center" style="margin-bottom:18px"><h1 style="font-size:22px;font-weight:800;letter-spacing:-.02em">' + esc(B.appName) + "</h1>" +
      '<p class="small muted">' + esc(B.tagline) + "</p></div>" +
      '<div class="auth-tabs"><button id="t-login" class="on">Log in</button><button id="t-reg">Create account</button></div>' +
      '<form id="auth-form" novalidate>' +
      '<div class="field hide" id="f-name"><label>Full name</label><input id="in-name" autocomplete="name" placeholder="Jane Artist"><div class="err"></div></div>' +
      '<div class="field" id="f-email"><label>Email</label><input id="in-email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com"><div class="err"></div></div>' +
      '<div class="field hide" id="f-phone"><label>Phone <span class="muted">(optional)</span></label><input id="in-phone" type="tel" placeholder="+31 6 ..."></div>' +
      '<div class="field" id="f-pass"><label>Password</label><input id="in-pass" type="password" autocomplete="current-password" placeholder="••••••••"><div class="err"></div></div>' +
      '<label class="remember"><input type="checkbox" id="remember" checked><span>Keep me logged in on this device</span></label>' +
      '<div class="row between" style="margin:2px 0 12px"><span></span><button type="button" class="linkish" id="forgot">Forgot password?</button></div>' +
      '<button class="btn btn-primary btn-block" id="auth-go" type="button">Log in</button>' +
      "</form>" +
      '<p class="demo-hint">Demo account: <code>demo@rocaudio.eu</code> / <code>demo1234</code></p>' +
      '<p class="demo-hint" style="margin-top:8px">Client data is required to use the app and is stored on this device.</p>' +
      '<p class="demo-hint" style="margin-top:6px">By continuing you agree to our <a href="preview-legal.html#terms">Terms</a> & <a href="preview-legal.html#privacy">Privacy Policy</a>.</p>' +
      '<p class="demo-hint" style="margin-top:4px;opacity:.6">build 1.5.2</p>' +
      '<p class="small muted center" style="margin-top:18px;opacity:.7">' + poweredLineWithGate() + "</p>" +
      "</div></div>";

    let mode = "login";
    const setMode = (m) => {
      mode = m;
      $("#t-login").classList.toggle("on", m === "login");
      $("#t-reg").classList.toggle("on", m === "reg");
      $("#f-name").classList.toggle("hide", m === "login");
      $("#f-phone").classList.toggle("hide", m === "login");
      $("#auth-go").textContent = m === "login" ? "Log in" : "Create account";
      $("#in-pass").autocomplete = m === "login" ? "current-password" : "new-password";
    };
    $("#forgot").onclick = () => {
      const m = openModal('<h3>Reset password</h3><p class="modal-sub">For accounts on this device. Cross-device email reset activates automatically once cloud sync (Supabase) is enabled.</p>' +
        '<div class="field"><label>Account email</label><input id="fp-mail" type="email" autocomplete="email" placeholder="you@email.com"></div>' +
        '<div class="field"><label>New password</label><input id="fp-pass" type="password" autocomplete="new-password" placeholder="min 6 characters"></div>' +
        '<div class="field"><label>Confirm new password</label><input id="fp-conf" type="password" autocomplete="new-password"></div>' +
        '<button class="btn btn-primary btn-block" id="fp-go" type="button">Reset password</button>');
      m.querySelector("#fp-go").onclick = () => {
        const em = m.querySelector("#fp-mail").value.trim().toLowerCase();
        const np = m.querySelector("#fp-pass").value, cf = m.querySelector("#fp-conf").value;
        const u = RBS.users().find((x) => x.email === em);
        if (!u) { toast("Not found", "No account with that email exists on this device.", "err"); return; }
        if (np.length < 6) { toast("Too short", "Password must be at least 6 characters.", "warn"); return; }
        if (np !== cf) { toast("Mismatch", "The two passwords differ.", "err"); return; }
        RBS.updateUser(u.id, { password: np });
        closeModal(); toast("Password updated", "Log in with your new password.", "ok");
      };
    };
    $("#t-login").onclick = () => setMode("login");
    $("#t-reg").onclick = () => setMode("reg");
    const doLogin = () => {
      const email = $("#in-email").value, pass = $("#in-pass").value;
      RBS.setRemember($("#remember") ? $("#remember").checked : true);
      const res = mode === "login"
        ? RBS.login(email, pass)
        : RBS.register({ name: $("#in-name").value, email, phone: $("#in-phone").value, password: pass });
      if (res.error) {
        const f = mode === "login" ? $("#f-pass") : $("#f-name");
        toast("Couldn't continue", res.error, "err");
        f.classList.add("invalid"); f.querySelector(".err").textContent = res.error;
        return;
      }
      toast(mode === "login" ? "Welcome back" : "Account created", "You're logged in to " + B.appName + ".", "ok");
      location.hash = "#/home";
    };
    $("#auth-go").addEventListener("click", doLogin);
    $("#auth-form").onsubmit = (e) => { e.preventDefault(); doLogin(); };
    ["#in-email", "#in-pass", "#in-name", "#in-phone"].forEach((sel) => {
      const el = $(sel);
      if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doLogin(); } });
    });
    const gate = $("#admin-gate");
    if (gate) gate.addEventListener("click", openConsoleGate);
  }

  function poweredLineWithGate() {
    const parts = String(B.footerLine).split("Tech");
    if (parts.length < 2) return esc(B.footerLine);
    return esc(parts[0]) + '<span id="admin-gate" class="secret-tap">Tech</span>' + esc(parts.slice(1).join("Tech"));
  }
  function openConsoleGate() {
    const m = openModal('<h3>Console</h3><p class="modal-sub">Enter your admin PIN.</p>' +
      '<div class="field"><label>Admin PIN</label><input id="pin-in" type="password" inputmode="numeric" placeholder="••••" autocomplete="off"></div>' +
      '<button class="btn btn-primary btn-block" id="pin-go" type="button">Enter Console</button>');
    const go = () => {
      const adm = RBS.loginAdmin(m.querySelector("#pin-in").value.replace(/\s/g, ""));
      if (adm.error) {
        toast("Access denied", adm.error, "err");
        m.querySelector("#pin-in").value = "";
        return;
      }
      closeModal(); toast("Console", "Welcome back, Roc. Your queue is live.", "ok");
      location.hash = "#/studio";
    };
    m.querySelector("#pin-go").addEventListener("click", go);
    m.querySelector("#pin-in").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  }

  /* ================= HOME ================= */
  function vHome(user) {
    const bs = RBS.userBookings(user.id);
    const active = bs.filter((b) => ["awaiting_payment", "confirmed", "in_progress"].includes(b.status));
    const paidSum = RBS.userPayments(user.id).filter((p) => p.status === "paid").reduce((s, p) => s + p.amount, 0);
    const nowTs = Date.now();
    const next = bs.filter((b) => ["confirmed", "in_progress"].includes(b.status) && new Date(b.date + "T" + b.time).getTime() >= nowTs - 3600e3)
      .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
    const featured = CONFIG.services.slice().sort((a, b) => b.rating - a.rating).slice(0, 3);

    return '<div class="view">' +
      '<div class="hero-card">' +
      '<span class="chip" style="background:rgba(7,11,18,.4);border-color:rgba(255,255,255,.14)">' + esc(B.techCompany) + " • " + esc(B.techCompanyTag) + "</span>" +
      '<h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:12px">Hello, ' + esc(user.name.split(" ")[0]) + "</h1>" +
      '<p class="small muted" style="margin-top:4px;max-width:40ch">' +
      (next ? "Next up: <b style='color:var(--text)'>" + esc(next.serviceName) + "</b> on " + RBS.prettyDate(next.date) + " at " + next.time + "."
            : "No upcoming sessions yet — book your next move below.") + "</p>" +
      '<div class="wave" style="height:38px;margin-top:14px">' + [12, 26, 18, 32, 14, 28, 22, 34, 16, 24, 12, 30].map((h, i) => '<i style="height:' + h + 'px;animation-delay:' + (i * .08).toFixed(2) + 's"></i>').join("") + "</div>" +
      "</div>" +
      '<div class="stat-row">' +
      '<div class="stat"><b>' + active.length + "</b><span>Active projects</span></div>" +
      '<div class="stat"><b>' + RBS.money(paidSum) + "</b><span>Total paid</span></div>" +
      '<div class="stat"><b>' + RBS.userInvoices(user.id).length + "</b><span>Invoices</span></div>" +
      "</div>" +
      '<div class="row" style="gap:10px;margin-top:4px">' +
      '<a class="btn btn-primary" style="flex:1" href="#/services">Book a service</a>' +
      '<a class="btn btn-ghost" style="flex:1" href="#/chat">Chat with studio</a>' +
      "</div>" +
      '<div class="sec-title">Featured services <a href="#/services">See all →</a></div>' +
      '<div class="svc-list">' + featured.map((s) => svcItem(s)).join("") + "</div>" +
      '<div class="sec-title">Recent payments <a href="#/payments">Tracker →</a></div>' +
      (RBS.userPayments(user.id).slice(0, 3).map((p) => payRow(p)).join("") || '<p class="small muted">No payments yet.</p>') +
      "</div>";
  }
  function bindHome() {
    document.querySelectorAll("[data-svc]").forEach((el) => el.addEventListener("click", () => { location.hash = "#/service/" + el.dataset.svc; }));
  }
  function svcItem(s) {
    const from = Math.min(...s.packages.map((p) => p.price));
    const r = RBS.serviceRating(s.id);
    return '<div class="card card-hover svc-item" data-svc="' + s.id + '">' +
      '<span class="ic">' + catIcon(s.category) + "</span>" +
      '<span class="info"><b>' + esc(s.name) + "</b><span>" + esc(s.delivery) + " • " + starRow(r.count ? r.avg : s.rating) + "</span></span>" +
      '<span class="pr"><b>' + RBS.money(from) + "</b><span>from</span></span></div>";
  }
  function payRow(p) {
    const bk = RBS.bookings().find((b) => b.id === p.bookingId);
    return '<div class="card bkg" style="cursor:default">' +
      '<span class="ic" style="width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(53,208,186,.09);border:1px solid rgba(53,208,186,.25)">' + I.doc.replace("<svg", '<svg style="width:18px;height:18px;stroke:var(--teal);fill:none;stroke-width:2"') + "</span>" +
      '<span class="info"><b>' + esc(p.ref) + " • " + esc(bk ? bk.serviceName : "Payment") + '</span><span class="small muted">' + timeAgo(p.createdAt) + " • " + esc(methodName(p.method)) + "</span></span>" +
      '<span class="rt"><b>' + RBS.moneyFull(p.amount) + '</b><span class="badge ' + p.status + '">' + STATUS[p.status] + "</span></span></div>";
  }
  const methodName = (id) => (CONFIG.paymentMethods.find((m) => m.id === id) || { name: id }).name;

  /* ================= SERVICES ================= */
  let curCat = "all";
  function vServices() {
    const cats = [{ id: "all", l: "All" }, { id: "training", l: "Training" }, { id: "production", l: "Production" }, { id: "studio", l: "Mix & Master" }];
    const list = CONFIG.services.filter((s) => curCat === "all" || s.category === curCat);
    return '<div class="view">' +
      '<div class="view-head"><div><h1>Services</h1><div class="sub">All prices, delivery times & payment plans</div></div></div>' +
      '<div class="cat-pills">' + cats.map((c) => '<button data-cat="' + c.id + '" class="' + (c.id === curCat ? "on" : "") + '">' + c.l + "</button>").join("") + "</div>" +
      '<div class="svc-list">' + list.map((s) => svcItem(s)).join("") + "</div></div>";
  }
  function bindServices() {
    document.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => { curCat = b.dataset.cat; $("#view").innerHTML = vServices(); bindServices(); }));
    bindHome();

  function bindBook(user, id, q) {
    const s = CONFIG.services.find((x) => x.id === id);
    const pkgId = q.get("pkg") || s.packages[0].id;
    const pkg = s.packages.find((p) => p.id === pkgId) || s.packages[0];
    const bonusIds = (q.get("b") || "").split(",").filter(Boolean);
    const bonuses = s.bonuses.filter((b) => bonusIds.includes(b.id));
    const gross = round2(pkg.price + bonuses.reduce((t, b) => t + b.price, 0));

    let selDate = null, selTime = CONFIG.booking.hours[1] || "10:00", selOpt = s.payOptions[0];
    const dueOf = (o) => (o === "full" ? gross : o === "deposit" ? round2(gross / 2) : round2(gross / 3));
    const syncDue = () => { $("#due-label").textContent = RBS.moneyFull(dueOf(selOpt)); };

    drawCal(); syncDue();

    function drawCal() {
      const y = calCursor.getFullYear(), mo = calCursor.getMonth();
      const first = new Date(y, mo, 1);
      const startDow = (first.getDay() + 6) % 7; // Mon=0
      const days = new Date(y, mo + 1, 0).getDate();
      const today = RBS.dateStr(new Date());
      const mine = RBS.userBookings(user.id).map((b) => b.date);
      let cells = "";
      for (let i = 0; i < startDow; i++) cells += '<span class="day empty"></span>';
      for (let d = 1; d <= days; d++) {
        const ds = y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const dow = new Date(ds + "T12:00:00").getDay();
        const off = ds < today || !CONFIG.booking.workDays.includes(dow);
        cells += '<button class="day ' + (off ? "off" : "") + (ds === today ? " today" : "") + (ds === selDate ? " sel" : "") + '" data-d="' + ds + '">' + d + (mine.includes(ds) ? '<span class="ev"></span>' : "") + "</button>";
      }
      $("#cal").innerHTML =
        '<div class="head"><button class="nav-b" id="cal-p">' + I.chevL + '</button><b>' + first.toLocaleDateString(undefined, { month: "long", year: "numeric" }) + '</b><button class="nav-b" id="cal-n">' + I.chevR + "</button></div>" +
        '<div class="grid7">' + ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => '<span class="dow">' + d + "</span>").join("") + cells + "</div>";
      $("#cal-p").onclick = () => { calCursor = new Date(y, mo - 1, 1); drawCal(); };
      $("#cal-n").onclick = () => { calCursor = new Date(y, mo + 1, 1); drawCal(); };
      $("#cal").querySelectorAll(".day[data-d]").forEach((el) => el.addEventListener("click", () => {
        selDate = el.dataset.d; drawCal();
      }));
    }

    $("#slots").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      selTime = b.dataset.t;
      $("#slots").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    }));
    $("#payopts").querySelectorAll(".pay-meth").forEach((el) => el.addEventListener("click", () => {
      selOpt = el.dataset.opt;
      $("#payopts").querySelectorAll(".pay-meth").forEach((x) => x.classList.toggle("on", x === el));
      syncDue();
    }));

    $("#confirm-book").addEventListener("click", () => {
      if (!selDate) { toast("Pick a date", "Choose a day on the calendar to continue.", "warn"); return; }
      const booking = RBS.createBooking({
        userId: user.id, serviceId: s.id, serviceName: s.name, packageName: pkg.name,
        bonuses: bonuses.map((b) => ({ name: b.name, price: b.price })),
        date: selDate, time: selTime, notes: $("#notes").value.trim(),
        payOption: selOpt, total: gross, status: "awaiting_payment",
      });
      startCheckout(user, booking, dueOf(selOpt));
    });
  }

  /* ================= CHECKOUT (demo gateway) ================= */
  function startCheckout(user, booking, amountDue, isBalance) {
    let method = "card";
    const m = openModal(
      '<h3>' + (isBalance ? "Pay remaining balance" : "Secure checkout") + "</h3>" +
      '<p class="modal-sub">' + esc(booking.serviceName) + " • " + esc(booking.packageName) + "</p>" +
      '<div class="sum-row"><span>Amount due now</span><b>' + RBS.moneyFull(amountDue) + "</b></div>" +
      '<div class="divider"></div>' +
      '<div id="meth-list">' + CONFIG.paymentMethods.map((pm, i) =>
        '<div class="pay-meth ' + (i === 0 ? "on" : "") + '" data-m="' + pm.id + '"><span class="rad"></span><span><b>' + esc(pm.name) + "</b><span>" + esc(pm.note) + "</span></span></div>").join("") + "</div>" +
      '<div id="card-form">' +
      '<div class="field"><label>Card number</label><input id="cc-num" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19"><div class="err">Enter a 16-digit card number (demo: 4242…)</div></div>' +
      '<div class="row"><div class="field" style="flex:1"><label>Expiry</label><input id="cc-exp" placeholder="MM/YY" maxlength="5"><div class="err">MM/YY</div></div>' +
      '<div class="field" style="flex:1"><label>CVC</label><input id="cc-cvc" inputmode="numeric" placeholder="123" maxlength="4"><div class="err">3–4 digits</div></div></div>' +
      "</div>" +
      '<div id="bank-info" class="hide card" style="padding:14px;margin-bottom:12px"><b class="small">Bank transfer details</b><p class="small muted" style="margin-top:5px">Account: ' + esc(B.bankAccount) + "<br>Reference: your payment ref (shown after confirm). Clears in 1–2 business days.</p></div>" +
      '<button class="btn btn-primary btn-block" id="pay-go" style="padding:15px">Pay ' + RBS.moneyFull(amountDue) + "</button>" +
      '<p class="small muted center" style="margin-top:10px">Demo gateway • encrypted in production • invoice auto-sent on success</p>',
      true);

    const syncMeth = () => {
      m.querySelector("#card-form").classList.toggle("hide", method !== "card");
      m.querySelector("#bank-info").classList.toggle("hide", method !== "bank");
    };
    m.querySelectorAll("[data-m]").forEach((el) => el.addEventListener("click", () => {
      method = el.dataset.m;
      m.querySelectorAll("[data-m]").forEach((x) => x.classList.toggle("on", x === el));
      syncMeth();
    }));
    syncMeth();
    m.querySelector("#cc-num").addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
    });
    m.querySelector("#cc-exp").addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "").slice(0, 4);
      e.target.value = v.length > 2 ? v.slice(0, 2) + "/" + v.slice(2) : v;
    });

    m.querySelector("#pay-go").addEventListener("click", () => {
      /* validate */
      if (method === "card") {
        const num = m.querySelector("#cc-num").value.replace(/\s/g, "");
        const exp = m.querySelector("#cc-exp").value;
        const cvc = m.querySelector("#cc-cvc").value;
        let ok = true;
        const bad = (sel, cond) => { const f = m.querySelector(sel).closest(".field"); f.classList.toggle("invalid", cond); if (cond) ok = false; };
        bad("#cc-num", !/^\d{16}$/.test(num));
        bad("#cc-exp", !/^(0[1-9]|1[0-2])\/\d{2}$/.test(exp));
        bad("#cc-cvc", !/^\d{3,4}$/.test(cvc));
        if (!ok) return;
      }
      const btn = m.querySelector("#pay-go");
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span> Processing…';
      setTimeout(() => finalize(method), 1400);
    });

    function finalize(methodId) {
      const isBank = methodId === "bank";
      const pay = RBS.createPayment({
        userId: user.id, bookingId: booking.id, amount: amountDue, method: methodId,
        status: isBank ? "pending" : "paid", paidAt: isBank ? null : RBS.now(),
      });
      RBS.updateBooking(booking.id, { status: "confirmed", payRef: pay.ref });

      /* invoice: create or top-up */
      let inv = RBS.userInvoices(user.id).find((i) => i.bookingId === booking.id);
      if (!inv) {
        const lines = [{ label: booking.serviceName + " — " + booking.packageName, amount: round2(booking.total - (booking.bonuses || []).reduce((t, b) => t + b.price, 0)) }]
          .concat((booking.bonuses || []).map((b) => ({ label: "Bonus: " + b.name, amount: b.price })));
        const { net, vat } = vatSplit(booking.total);
        inv = RBS.createInvoice({
          userId: user.id, bookingId: booking.id, lines,
          subtotal: net, vat, total: booking.total,
          paid: isBank ? 0 : amountDue, status: (!isBank && amountDue >= booking.total) ? "paid" : "pending",
        });
      } else {
        const list = RBS.invoices();
        const cur = list.find((i) => i.id === inv.id);
        cur.paid = round2(cur.paid + (isBank ? 0 : amountDue));
        if (cur.paid >= cur.total) cur.status = "paid";
        RBS.set("rbs_invoices", list);
        inv = cur;
      }
      RBS.sendInvoice(inv.id); // auto-email client + business copy (simulated)

      RBS.notify(user.id, isBank ? "Booking received — payment pending" : "Payment confirmed ✓",
        (isBank ? "Bank transfer registered for " : RBS.moneyFull(amountDue) + " received for ") + booking.serviceName + ". Invoice " + inv.number + " emailed to you and " + B.businessEmail + ".");

      m.innerHTML =
        '<div class="success-anim">' +
        (isBank
          ? '<div class="ring" style="border-color:var(--warn);background:rgba(255,180,84,.1)"><svg style="stroke:var(--warn)" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><h3>Payment pending</h3><p class="modal-sub">Complete the bank transfer to ' + esc(B.bankAccount) + ". Your slot is reserved; status flips to Paid automatically once cleared.</p>"
          : '<div class="ring"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><h3>Payment confirmed</h3><p class="modal-sub">' + RBS.moneyFull(amountDue) + " via " + esc(methodName(methodId)) + ". Your booking is confirmed and the invoice is on its way.</p>") +
        '<span class="ref">REF ' + esc(pay.ref) + " • INV " + esc(inv.number) + "</span>" +
        '<p class="small muted" style="margin-top:12px">Invoice auto-sent to <b>' + esc(user.email) + "</b><br>Copy sent to <b>" + esc(B.businessEmail) + "</b></p>" +
        '<div class="row" style="gap:10px;margin-top:20px">' +
        '<button class="btn btn-ghost" style="flex:1" id="ck-done">Done</button>' +
        '<button class="btn btn-primary" style="flex:1" id="ck-inv">View invoice</button>' +
        "</div></div>";
      m.querySelector("#ck-done").onclick = () => { closeModal(); location.hash = "#/bookings"; render(); };
      m.querySelector("#ck-inv").onclick = () => { closeModal(); location.hash = "#/invoice/" + inv.id; render(); };
      toast(isBank ? "Booking reserved" : "Payment confirmed", "Invoice " + inv.number + " sent to " + user.email + " + " + B.businessEmail, isBank ? "warn" : "ok");
    }
  }

      (pay ? '<span class="badge ' + pay.status + '">Payment: ' + STATUS[pay.status] + "</span>" : "") + "</div>" +
      (b.notes ? '<p class="small muted" style="margin-bottom:12px">“' + esc(b.notes) + '”</p>' : "") +
      '<div class="sum-row"><span>Total</span><b>' + RBS.moneyFull(b.total) + "</b></div>" +
      (pay ? '<div class="sum-row"><span>Paid (' + esc(methodName(pay.method)) + ")</span><b>" + RBS.moneyFull(pay.amount) + "</b></div>" : "") +
      (inv ? '<div class="sum-row"><span>Balance</span><b>' + RBS.moneyFull(Math.max(0, inv.total - inv.paid)) + "</b></div>" : "") +
      '<div class="divider"></div>' +
      '<div style="display:flex;flex-direction:column;gap:9px">' +
      (b.status === "awaiting_payment" ? '<button class="btn btn-primary btn-block" id="bm-pay">Pay now</button>' : "") +
      (inv && inv.total - inv.paid > 0.005 && b.status !== "awaiting_payment" ? '<button class="btn btn-primary btn-block" id="bm-bal">Pay balance ' + RBS.moneyFull(inv.total - inv.paid) + "</button>" : "") +
      (inv ? '<button class="btn btn-ghost btn-block" id="bm-inv">View invoice ' + esc(inv.number) + "</button>" : "") +
      '<a class="btn btn-ghost btn-block" href="#/chat" onclick="document.getElementById(\'modal-root\').innerHTML=\'\'">Message the studio</a>' +
      (["confirmed", "awaiting_payment"].includes(b.status) ? '<button class="btn btn-danger btn-block" id="bm-cancel">Cancel booking</button>' : "") +
      "</div>");
    const mp = $("#modal-root");
    if (mp.querySelector("#bm-pay")) mp.querySelector("#bm-pay").onclick = () => { closeModal(); startCheckout(user, b, b.total); };
    if (mp.querySelector("#bm-bal")) mp.querySelector("#bm-bal").onclick = () => {
      const balance = round2(inv.total - inv.paid); closeModal(); startCheckout(user, b, balance, true);
    };
    if (mp.querySelector("#bm-inv")) mp.querySelector("#bm-inv").onclick = () => { closeModal(); location.hash = "#/invoice/" + inv.id; };
    if (mp.querySelector("#bm-cancel")) mp.querySelector("#bm-cancel").onclick = () => {
      RBS.updateBooking(id, { status: "cancelled" });
      RBS.notify(user.id, "Booking cancelled", b.serviceName + " on " + RBS.prettyDate(b.date) + " was cancelled.");
      closeModal(); toast("Booking cancelled", "Any paid amount will be refunded per policy.", "warn"); render();
    };
  }

  /* ================= CALENDAR ================= */
  function vCalendar(user) {
    return '<div class="view">' +
      '<button class="back-btn" onclick="history.back()">' + I.back + " Back</button>" +
      '<div class="view-head"><div><h1>Booking calendar</h1><div class="sub">Your sessions at a glance</div></div></div>' +
      '<div class="cal" id="cal"></div>' +
      '<div class="sec-title" id="day-title">Select a day</div>' +
      '<div class="svc-list" id="day-list"></div></div>';
  }
  function bindCalendar(user) {
    let sel = null;
    const draw = () => {
      const y = calCursor.getFullYear(), mo = calCursor.getMonth();
      const first = new Date(y, mo, 1);
      const startDow = (first.getDay() + 6) % 7;
      const days = new Date(y, mo + 1, 0).getDate();
      const today = RBS.dateStr(new Date());
      const mine = RBS.userBookings(user.id).map((b) => b.date);
      let cells = "";
      for (let i = 0; i < startDow; i++) cells += '<span class="day empty"></span>';
      for (let d = 1; d <= days; d++) {
        const ds = y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        cells += '<button class="day ' + (ds === today ? " today" : "") + (ds === sel ? " sel" : "") + '" data-d="' + ds + '">' + d + (mine.includes(ds) ? '<span class="ev"></span>' : "") + "</button>";
      }
      $("#cal").innerHTML =
        '<div class="head"><button class="nav-b" id="cal-p">' + I.chevL + '</button><b>' + first.toLocaleDateString(undefined, { month: "long", year: "numeric" }) + '</b><button class="nav-b" id="cal-n">' + I.chevR + "</button></div>" +
        '<div class="grid7">' + ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => '<span class="dow">' + d + "</span>").join("") + cells + "</div>";
      $("#cal-p").onclick = () => { calCursor = new Date(y, mo - 1, 1); draw(); };
      $("#cal-n").onclick = () => { calCursor = new Date(y, mo + 1, 1); draw(); };
      $("#cal").querySelectorAll(".day[data-d]").forEach((el) => el.addEventListener("click", () => { sel = el.dataset.d; draw(); showDay(); }));
    };
    const showDay = () => {
      const list = RBS.userBookings(user.id).filter((b) => b.date === sel);
      $("#day-title").textContent = RBS.prettyDate(sel) + " — " + (list.length ? list.length + " booking(s)" : "free day");
      $("#day-list").innerHTML = list.length ? list.map((b) =>
        '<div class="card bkg" data-b="' + b.id + '"><span class="datebox" style="width:46px"><b style="font-size:13px">' + b.time + "</b><span>slot</span></span>" +
        '<span class="info"><b>' + esc(b.serviceName) + "</b><span>" + esc(b.packageName) + "</span></span>" +
        '<span class="badge ' + b.status + '">' + STATUS[b.status] + "</span></div>").join("")
        : '<p class="small muted">Nothing booked this day. <a href="#/services">Book something →</a></p>';
      bindBookings(user);
    };
    draw();
  }

  /* ================= PAYMENTS TRACKER ================= */
  function vPayments(user) {
    const ps = RBS.userPayments(user.id);
    const paid = ps.filter((p) => p.status === "paid").reduce((s, p) => s + p.amount, 0);
    const pend = ps.filter((p) => p.status === "pending").reduce((s, p) => s + p.amount, 0);
    const invs = RBS.userInvoices(user.id);
    return '<div class="view">' +
      '<button class="back-btn" onclick="history.back()">' + I.back + " Back</button>" +
      '<div class="view-head"><div><h1>Payment tracker</h1><div class="sub">Every euro, accounted for</div></div></div>' +
      '<div class="stat-row">' +
      '<div class="stat"><b>' + RBS.money(paid) + "</b><span>Paid</span></div>" +
      '<div class="stat"><b>' + RBS.money(pend) + "</b><span>Pending</span></div>" +
      '<div class="stat"><b>' + invs.length + "</b><span>Invoices</span></div></div>" +
      '<div class="sec-title">Transactions</div>' +
      '<div class="svc-list">' + (ps.length ? ps.map((p) => payRow(p) +
        '<div style="height:0"></div>').join("") : '<p class="small muted">No transactions yet.</p>') + "</div>" +
      '<div class="sec-title">Invoices</div>' +
      '<div class="svc-list">' + (invs.length ? invs.map((i) =>
        '<div class="card bkg" data-inv="' + i.id + '"><span class="ic" style="width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(90,200,250,.09);border:1px solid rgba(90,200,250,.25)">' + I.doc.replace("<svg", '<svg style="width:18px;height:18px;stroke:var(--ice);fill:none;stroke-width:2"') + "</span>" +
        '<span class="info"><b>' + esc(i.number) + '</b><span class="small muted">Issued ' + timeAgo(i.createdAt) + " • sent " + (i.sentAt ? timeAgo(i.sentAt) : "—") + "</span></span>" +
        '<span class="rt"><b>' + RBS.money(i.total) + '</b><span class="badge ' + i.status + '">' + STATUS[i.status] + "</span></span></div>").join("")
        : '<p class="small muted">No invoices yet.</p>') + "</div></div>";
  }
  function bindPayments(user) {
    document.querySelectorAll("[data-inv]").forEach((el) => el.addEventListener("click", () => { location.hash = "#/invoice/" + el.dataset.inv; }));
  }

  function bindInvoice(id, user) {

  const msgBubble = (m) => '<div class="msg ' + (m.from === "me" ? "out" : "in") + '">' +
    (m.from !== "me" ? '<span class="sender">' + (m.from === "assistant" ? "Studio Assistant • auto" : "Roc • studio") + "</span>" : "") +
    esc(m.text) + '<span class="tm">' + new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "</span></div>";
  function bindChat(user) {
    const body = $("#chat-body");
    body.scrollTop = body.scrollHeight;
    RBS.set("rbs_chatread_" + user.id, RBS.now());
    const send = () => {
      const inp = $("#chat-in");
      const text = inp.value.trim();
      if (!text) return;
      inp.value = "";
      const msg = RBS.sendMessage(user.id, "me", text);
      body.insertAdjacentHTML("beforeend", msgBubble(msg));
      body.scrollTop = body.scrollHeight;
      body.insertAdjacentHTML("beforeend", '<div class="typing" id="typing"><i></i><i></i><i></i></div>');
      body.scrollTop = body.scrollHeight;
      if (!RBS.getAssistant()) { setTimeout(() => { const t = $("#typing"); if (t) t.remove(); }, 700); return; }
      setTimeout(() => {
        const t = $("#typing"); if (t) t.remove();
        const rep = RBS.sendMessage(user.id, "assistant", RBS.autoReply(text));
        body.insertAdjacentHTML("beforeend", msgBubble(rep));
        body.scrollTop = body.scrollHeight;
        RBS.notify(user.id, "New message from the studio", rep.text.slice(0, 80), "#/chat");
        updateBell(user);
      }, 1100);

    $("#chat-in").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  }

  /* ---- queue ---- */
  function vStudioBook() {
    const bs = RBS.bookings().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const groups = [["awaiting_payment", "Awaiting payment"], ["confirmed", "Confirmed — schedule"], ["in_progress", "In progress"], ["delivered", "Delivered"], ["cancelled", "Cancelled"]];

        if (!list.length) return "";
        return '<div class="sec-title">' + g[1] + " (" + list.length + ')</div><div class="svc-list">' + list.map((b) => {
          const acts =
            (b.status === "awaiting_payment" ? '<button class="btn btn-primary btn-sm" data-act="paid" data-id="' + b.id + '">Mark paid & confirm</button>' : "") +
            (b.status === "confirmed" ? '<button class="btn btn-primary btn-sm" data-act="start" data-id="' + b.id + '">Start work</button>' : "") +
            (b.status === "in_progress" ? '<button class="btn btn-primary btn-sm" data-act="deliver" data-id="' + b.id + '">Deliver</button>' : "") +
            (["confirmed", "awaiting_payment"].includes(b.status) ? '<button class="btn btn-danger btn-sm" data-act="cancel" data-id="' + b.id + '">Cancel</button>' : "");
          return bkgRowStudio(b, acts ? '<div class="row" style="gap:7px;margin-top:10px;width:100%">' + acts + "</div>" : "");

  function bindStudioBook() { bindStudioBookActions(); }
  function bindStudioBookActions() {
    document.querySelectorAll("[data-act]").forEach((btn) => btn.addEventListener("click", () => {
      const id = btn.dataset.id, act = btn.dataset.act;
      const b = RBS.bookings().find((x) => x.id === id);
      if (act === "paid") {
        const pend = RBS.payments().find((p) => p.bookingId === id && p.status === "pending");
        if (pend) RBS.markPaymentPaid(pend.id);
        RBS.setBookingStatus(id, "confirmed");
        toast("Booking confirmed", (b ? b.serviceName : "") + " — client notified + invoice updated.", "ok");
      }
      if (act === "start") { RBS.setBookingStatus(id, "in_progress"); toast("Work started", "Client sees “In progress” and got a chat update.", "ok"); }
      if (act === "deliver") { RBS.setBookingStatus(id, "delivered"); toast("Delivered", "Client notified — they can now leave a review.", "ok"); }
      if (act === "cancel") { RBS.setBookingStatus(id, "cancelled"); toast("Booking cancelled", "Client notified per refund policy.", "warn"); }
      render();
    }));
  }

        '<button class="btn btn-primary btn-block" id="rep-go">Publish reply</button>');
      m.querySelector("#rep-go").onclick = () => {
        const t = m.querySelector("#rep-text").value.trim();
        if (t.length < 3) { toast("Too short", "Write a sentence or two.", "warn"); return; }
        RBS.addReviewReply(b.dataset.rep, t);
        closeModal(); toast("Reply published", "The client was notified too.", "ok"); render();
      };
    }));
  }

  /* ================= NOTIFICATIONS PANEL ================= */
  function notifPanel(user) {
    const root = $("#notif-root");
    if (root.firstChild) { root.innerHTML = ""; return; }
    const ns = RBS.userNotifs(user.id);
    root.innerHTML = '<div class="notif-panel"><div class="hd">Notifications <button class="btn btn-ghost btn-sm" id="ntf-read">Mark all read</button></div>' +
      '<div class="list">' + (ns.length ? ns.map((n) =>
        '<div class="notif ' + (n.read ? "" : "unread") + '" data-route="' + esc(n.route || "#/bookings") + '"><span class="ic">' + I.bell + "</span><div><b>" + esc(n.title) + "</b><span>" + esc(n.body) + '</span><time>' + timeAgo(n.ts) + "</time></div></div>").join("")
        : '<p class="small muted" style="padding:20px">No notifications yet.</p>') + "</div></div>";
    $("#ntf-read").addEventListener("click", () => { RBS.markAllRead(user.id); root.innerHTML = ""; updateBell(user); });
    root.querySelectorAll(".notif[data-route]").forEach((el) => el.addEventListener("click", () => {
      RBS.markAllRead(user.id); root.innerHTML = ""; updateBell(user);
      location.hash = el.dataset.route;
    }));
    setTimeout(() => {
      const close = (e) => { if (!root.contains(e.target) && e.target.closest("#btn-bell") === null) { root.innerHTML = ""; document.removeEventListener("click", close); } };
      document.addEventListener("click", close);
    }, 0);
  }

  /* ================= INSTALL ================= */
  let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferredInstall = e;
    $("#btn-install").style.display = "grid";
  });
  function triggerInstall() {
    if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; return; }
    if (window.matchMedia("(display-mode: standalone)").matches) { toast("Already installed", "You're using the installed app.", "ok"); return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    toast("Install " + B.appName, ios ? "Safari → Share □↑ → Add to Home Screen." : "Browser menu ⋮ → Install app / Add to Home screen.", "ok");
  }

  /* ================= BOOT ================= */
  $("#top-tag").textContent = B.techCompanyTag;
  $("#btn-bell").addEventListener("click", (e) => { e.stopPropagation(); const u = RBS.currentUser(); if (u) notifPanel(u); });
  $("#btn-install").addEventListener("click", triggerInstall);
  $("#tabbar").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && b.dataset.t) location.hash = "#/" + b.dataset.t; });
  RBS.seed();
  Sync.start();
  window.addEventListener("rbs-sync", () => { if (RBS.currentUser() || RBS.isStudio()) render(); });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  if (!location.hash) location.hash = "#/home";
  render();
})();

</script>
</body>
</html>
